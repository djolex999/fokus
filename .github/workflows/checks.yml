name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    # Both platforms, because the focus return has a real implementation on each
    # and they do not share code. A macOS-only check let RunEvent::Reopen reach
    # a Windows machine: the variant does not exist there, and nothing here
    # noticed until someone tried to compile it.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm tsc --noEmit
      - name: build frontend
        run: pnpm exec vite build
      - name: rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
